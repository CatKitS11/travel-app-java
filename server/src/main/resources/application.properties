spring.application.name=travel-app
server.port=${PORT:8081}
server.address=0.0.0.0

logging.level.org.springframework=INFO
logging.level.com.techup=DEBUG

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

## Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## Disable schema validation on startup to reduce connections
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

supabase.url=${SUPABASE_URL:}
supabase.bucket=${SUPABASE_BUCKET:uploads}
supabase.apiKey=${SUPABASE_API_KEY:}
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Clerk Configuration
clerk.publishable.key=${CLERK_PUBLISHABLE_KEY:}
clerk.secret.key=${CLERK_SECRET_KEY:}
clerk.jwks.url=${CLERK_JWKS_URL:}
clerk.instance=${CLERK_INSTANCE:}

spring.config.import=optional:classpath:application-local.properties